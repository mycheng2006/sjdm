<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>随机抽取</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body {
    width:100%; height:100%; overflow:hidden;
    background: radial-gradient(circle at 50% 45%, #16224e 0%, #0a1030 55%, #04071a 100%);
    font-family: "Microsoft YaHei","PingFang SC","HarmonyOS Sans",arial,sans-serif;
    color:#fff;
    -webkit-user-select: none; user-select: none;
    touch-action: manipulation;
  }
  #bgCanvas { position:absolute; inset:0; z-index:0; pointer-events:none; }
  #halo {
    position:absolute; left:50%; top:50%;
    width:70vmin; height:70vmin;
    margin-left:-35vmin; margin-top:-35vmin;
    border-radius:50%;
    background: radial-gradient(circle,
      rgba(120,180,255,0.28) 0%,
      rgba(80,130,255,0.14) 35%,
      rgba(40,80,200,0.04) 60%,
      transparent 75%);
    z-index:1; pointer-events:none;
    animation: haloBreath 6s ease-in-out infinite;
  }
  @keyframes haloBreath {
    0%,100% { transform: scale(1);   opacity: 0.85; }
    50%     { transform: scale(1.1); opacity: 1; }
  }
  #stage {
    position:absolute; inset:0; overflow:hidden;
    z-index:2; transform-origin: 50% 50%;
  }
  #stage.pulse { animation: stagePulse 0.7s ease-out; }
  @keyframes stagePulse {
    0%   { transform: scale(1);    filter: brightness(1); }
    25%  { transform: scale(1.05); filter: brightness(1.6) saturate(1.3); }
    100% { transform: scale(1);    filter: brightness(1); }
  }
  #stage span {
    position:absolute; left:50%; top:50%;
    white-space:nowrap; will-change:transform, opacity;
    transform-origin:50% 50%;
    color:#fff; font-size:22px;
    text-shadow: 0 0 6px rgba(120,180,255,0.6);
    transition: color .3s;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
  }
  #stage span.picked {
    color: #555 !important;
    text-shadow: none !important;
    opacity: 0.55 !important;
    text-decoration: line-through;
    font-style: italic;
  }

  #result {
    position:absolute; inset:0;
    display:none; z-index:100;
    background: rgba(8, 12, 30, 0.35);
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
    align-items:center; justify-content:center;
    flex-wrap:wrap; align-content:center;
    gap: 0.8vh 1.6vw;
    padding: 3vh 3vw;
    overflow:hidden;
    animation: fadeIn 0.35s ease both;
  }
  #result.show { display:flex; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  #result span {
    display:inline-block;
    line-height: 1.1;
    font-weight: 700;
    color: #ffe08a;
    background: linear-gradient(180deg, #fff3c4 0%, #ffcf55 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    padding: 0.05em 0.2em;
    letter-spacing: 0.04em;
    white-space: nowrap;
    filter:
      drop-shadow(0 0 6px rgba(255,210,90,0.55))
      drop-shadow(0 0 18px rgba(255,160,40,0.35));
    animation: flyIn 0.85s cubic-bezier(0.19, 1, 0.22, 1) both;
  }
  @keyframes flyIn {
    0% { transform: translate(var(--from-x, 0), var(--from-y, 0)) scale(0.35); opacity: 0.9; }
    60% { opacity: 1; }
    100% { transform: translate(0, 0) scale(1); opacity: 1; }
  }

  /* ============ 按钮区：所有按钮统一大小 ============ */
  .tools {
    position:absolute;
    right: max(12px, env(safe-area-inset-right));
    bottom: max(12px, env(safe-area-inset-bottom));
    left: auto;
    z-index:200;
    display: flex;
    flex-wrap: nowrap;
    justify-content: flex-end;      /* 电脑右对齐 */
    align-items: stretch;           /* 高度拉平 */
    gap: 6px;
  }
  .tools button {
    /* 统一大小：固定宽高 */
    width: 76px;
    height: 46px;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    background: #e6e6e6;
    color: #333;
    cursor: pointer;
    font-family: inherit;
    -webkit-appearance: none;
    appearance: none;
    transition: transform 0.1s;
    white-space: nowrap;
    flex: 0 0 auto;
  }
  .tools button:active { transform: scale(0.94); }
  .tools button.active { background:#ca3c3c; color:#fff; }
  .tools .start { background:#1cb841; color:#fff; }
  .tools .stop  { background:#ca3c3c; color:#fff; }
  .tools .reset { background:#df7514; color:#fff; }
  .tools .voice { background:#7e57c2; color:#fff; }
  .tools .voice.off { background:#888; }

  /* ============ 手机端：居中 + 按钮自适应等宽 ============ */
  @media (max-width: 700px), (pointer: coarse) {
    .tools {
      right: max(6px, env(safe-area-inset-right));
      left: max(6px, env(safe-area-inset-left));
      bottom: max(6px, env(safe-area-inset-bottom));
      gap: 4px;
      justify-content: center;      /* 手机居中 */
      overflow: hidden;
    }
    .tools button {
      /* 手机上：6 个按钮均分整行宽度 */
      width: auto;
      flex: 1 1 0;
      min-width: 0;
      height: 44px;
      font-size: 14px;
      border-radius: 6px;
      padding: 0;
    }
    #halo { width: 80vmin; height: 80vmin; margin-left:-40vmin; margin-top:-40vmin; }
  }

  /* 超窄屏（<380px）再压字号 */
  @media (max-width: 380px) {
    .tools button {
      height: 40px;
      font-size: 13px;
    }
  }
</style>
</head>
<body>
<canvas id="bgCanvas"></canvas>
<div id="halo"></div>
<div id="stage"></div>
<div id="result"></div>
<div class="tools">
  <button data-count="3">3</button>
  <button data-count="2">2</button>
  <button data-count="1" class="active">1</button>
  <button id="btnStart" class="start">开始</button>
  <button id="btnReset" class="reset">重置</button>
  <button id="btnVoice" class="voice">🔊</button>
</div>

<script src="member.js"></script>

<script>
(function(){
  var bgCanvas = document.getElementById('bgCanvas');
  var bgCtx    = bgCanvas.getContext('2d');
  var stage    = document.getElementById('stage');
  var resultEl = document.getElementById('result');
  var btnStart = document.getElementById('btnStart');
  var btnReset = document.getElementById('btnReset');
  var btnVoice = document.getElementById('btnVoice');
  var countBtns = document.querySelectorAll('.tools button[data-count]');

  // ================= 名单解析 =================
  var people = [];
  if (typeof nameListText === 'string') {
    nameListText.split(/\r?\n/).forEach(function(line){
      line = line.trim();
      if (!line) return;
      var idx = line.indexOf('|');
      var disp, tts;
      if (idx >= 0) {
        disp = line.substring(0, idx).trim();
        tts  = line.substring(idx + 1).trim() || disp;
      } else { disp = line; tts = line; }
      if (disp) people.push({ name: disp, tts: tts });
    });
  } else if (typeof member !== 'undefined' && member.length) {
    member.forEach(function(m){
      if (m.name) people.push({ name: m.name, tts: m.name });
    });
  }
  if (!people.length) {
    document.body.innerHTML = '<div style="padding:40px;color:#fff;font-size:18px;">没找到名单，请检查 member.js。</div>';
    return;
  }

  // ================= 抽取记录 =================
  var choosed = {};
  try { choosed = JSON.parse(localStorage.getItem('choosed_v20') || '{}'); } catch(e){}
  function saveChoosed(){
    try { localStorage.setItem('choosed_v20', JSON.stringify(choosed)); } catch(e){}
  }

  // ================= 3D 透视星空 =================
  var stars = [];
  var viewW = 0, viewH = 0;
  var starFocal = 0;

  function initStars(){
    viewW = window.innerWidth;
    viewH = window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    bgCanvas.width  = Math.round(viewW * dpr);
    bgCanvas.height = Math.round(viewH * dpr);
    bgCanvas.style.width  = viewW + 'px';
    bgCanvas.style.height = viewH + 'px';
    bgCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

    starFocal = Math.max(viewW, viewH) * 1.2;
    stars = [];
    for (var i = 0; i < 420; i++){
      stars.push({
        x: Math.random() * viewW,
        y: Math.random() * viewH,
        z: Math.random() * starFocal,
        b: 0.4 + Math.random() * 0.6
      });
    }
  }

  function drawStars(t){
    bgCtx.clearRect(0, 0, viewW, viewH);
    var cx = viewW / 2, cy = viewH / 2;
    for (var i = 0; i < stars.length; i++){
      var s = stars[i];
      s.z -= 0.9;
      if (s.z <= 1) { s.z = starFocal; s.x = Math.random() * viewW; s.y = Math.random() * viewH; }
      var scale = starFocal / s.z;
      var px = (s.x - cx) * scale + cx;
      var py = (s.y - cy) * scale + cy;
      if (px < -50 || px > viewW + 50 || py < -50 || py > viewH + 50) continue;
      var r = Math.min(2.4, scale * 0.7);
      var a = Math.min(1, (1 - s.z / starFocal) * 1.3 + 0.08) * s.b;
      a *= 0.85 + 0.15 * Math.sin(t * 0.002 + i);
      bgCtx.beginPath();
      bgCtx.arc(px, py, r, 0, Math.PI * 2);
      bgCtx.fillStyle = 'rgba(180,210,255,' + a.toFixed(3) + ')';
      bgCtx.fill();
    }
  }

  // ================= 名字球 =================
  var items = [];
  function buildStage(){
    stage.innerHTML = '';
    items = [];
    people.forEach(function(p){
      var el = document.createElement('span');
      el.textContent = p.name;
      if (choosed[p.name]) el.className = 'picked';
      stage.appendChild(el);
      items.push({ el: el, name: p.name, tts: p.tts });
    });
    var N = items.length || 1;
    var inc = Math.PI * (3 - Math.sqrt(5));
    var off = 2 / N;
    items.forEach(function(it, i){
      var y = i * off - 1 + off/2;
      var r = Math.sqrt(Math.max(0, 1 - y*y));
      var phi = i * inc;
      it.x = Math.cos(phi) * r; it.y = y; it.z = Math.sin(phi) * r;
    });
  }

  // ================= 动画 =================
  var angleY = 0, angleX = 0;
  var velY = 0, velX = 0;
  var targetVelY = 0.0025, targetVelX = 0.0008;
  var running = false;
  var radius = 300;
  var lastT = 0;

  function isMobile(){
    return /Mobi|Android|iPhone|iPad|iPod|HarmonyOS/i.test(navigator.userAgent);
  }
  function resize(){
    var w = window.innerWidth, h = window.innerHeight;
    radius = Math.min(w, h) * (isMobile() ? 0.42 : 0.36);
  }
  resize();
  window.addEventListener('resize', function(){ resize(); initStars(); });

  function step(dt){
    var k = dt / 16.7;
    if (k > 3) k = 3;
    velY += (targetVelY - velY) * 0.12 * k;
    velX += (targetVelX - velX) * 0.12 * k;
    angleY += velY * k;
    angleX += velX * k;
    if (angleX >  0.38) { angleX =  0.38; targetVelX = -Math.abs(targetVelX); }
    if (angleX < -0.38) { angleX = -0.38; targetVelX =  Math.abs(targetVelX); }

    var cy = Math.cos(angleY), sy = Math.sin(angleY);
    var cx = Math.cos(angleX), sx = Math.sin(angleX);
    var focal2 = Math.max(window.innerWidth, window.innerHeight) * 1.2;

    for (var i = 0; i < items.length; i++){
      var it = items[i];
      var x1 =  it.x * cy - it.z * sy;
      var z1 =  it.x * sy + it.z * cy;
      var y2 =  it.y * cx - z1 * sx;
      var z2 =  it.y * sx + z1 * cx;
      var scale = focal2 / (focal2 - z2 * radius);
      var tx = x1 * radius * scale;
      var ty = y2 * radius * scale;
      var depth = (z2 + 1) / 2;
      var alpha = 0.15 + 0.85 * depth;
      var size  = 10 + 16 * depth;
      var st = it.el.style;
      st.transform = 'translate3d(' + tx.toFixed(1) + 'px,' + ty.toFixed(1) + 'px,0) scale(' + scale.toFixed(3) + ') translate(-50%,-50%)';
      st.fontSize  = size.toFixed(1) + 'px';
      st.opacity   = alpha.toFixed(3);
      st.zIndex    = (depth * 1000) | 0;
      st.textShadow = '0 0 ' + (6 + 10 * depth).toFixed(0) + 'px rgba(160,200,255,' + (0.35 + 0.55 * depth).toFixed(2) + ')';
    }
  }

  function render(t){
    var dt = lastT ? (t - lastT) : 16.7;
    lastT = t;
    step(dt);
    drawStars(t);
    requestAnimationFrame(render);
  }

  // ================= 抽签 =================
  function draw(n){
    var pool = [];
    for (var i = 0; i < items.length; i++){
      if (!choosed[items[i].name]) pool.push(items[i]);
    }
    if (!pool.length) return [];
    for (var i = pool.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = pool[i]; pool[i] = pool[j]; pool[j] = t;
    }
    var picked = pool.slice(0, n);
    for (var k = 0; k < picked.length; k++){
      choosed[picked[k].name] = 1;
      picked[k].el.className = 'picked';
    }
    saveChoosed();
    var ret = [];
    for (var m = 0; m < picked.length; m++){
      ret.push({ name: picked[m].name, tts: picked[m].tts });
    }
    return ret;
  }

  // ================= 字号 =================
  function pickFontSize(count, w, h, maxLen){
    var cols, rows;
    if (count <= 1)      { cols = 1; rows = 1; }
    else if (count <= 2) { cols = 2; rows = 1; }
    else if (count <= 3) { cols = 3; rows = 1; }
    else if (count <= 4) { cols = 2; rows = 2; }
    else if (count <= 6) { cols = 3; rows = 2; }
    else                 { cols = Math.ceil(Math.sqrt(count)); rows = Math.ceil(count / cols); }
    var boxW = w * 0.75, boxH = h * 0.75;
    var cellW = boxW / cols - w * 0.02;
    var cellH = boxH / rows - h * 0.02;
    return Math.round(Math.min(cellW / Math.max(2, maxLen), cellH / 1.15));
  }

  // ================= 语音（低延迟 + iOS 修复） =================
  var voiceOn = true;
  var speechSupported = ('speechSynthesis' in window) && ('SpeechSynthesisUtterance' in window);
  var zhVoice = null;
  var speechPrimed = false;

  function sanitizeForTTS(text){
    return String(text)
      .replace(/[<>]/g, function(c){ return c === '<' ? '＜' : '＞'; })
      .replace(/[\u0000-\u001F\u007F]/g, '')
      .trim();
  }

  function pollVoices(cb){
    if (!speechSupported) return;
    var attempts = 0;
    var timer = setInterval(function(){
      attempts++;
      var voices = window.speechSynthesis.getVoices() || [];
      var found = false;
      for (var i = 0; i < voices.length; i++){
        var v = voices[i];
        var lang = (v.lang || '').toLowerCase();
        if (lang.indexOf('zh') === 0 || lang.indexOf('cmn') === 0 || lang.indexOf('yue') === 0){
          if (!zhVoice) zhVoice = v;
          if (/tingting|ting-ting|huihui|yaoyao|xiaoxiao|meijia|sinji|普通话|女/i.test(v.name)){
            zhVoice = v;
            found = true;
            break;
          }
        }
      }
      if (found || attempts > 15){
        clearInterval(timer);
        if (cb) cb();
      }
    }, 200);
  }

  function primeSpeech(){
    if (!speechSupported || speechPrimed) return;
    speechPrimed = true;
    try {
      var u = new SpeechSynthesisUtterance(' ');
      u.lang = 'zh-CN';
      u.volume = 0;
      u.rate = 1.5;
      window.speechSynthesis.speak(u);
    } catch(e){}
  }

  function speakNames(list){
    if (!voiceOn || !speechSupported || !list.length) return;
    if (!speechPrimed) primeSpeech();
    try { window.speechSynthesis.cancel(); } catch(e){}
    if (!zhVoice){
      pollVoices(function(){ doSpeak(list); });
    } else {
      doSpeak(list);
    }
  }

  function doSpeak(list){
    var idx = 0;
    function next(){
      if (idx >= list.length) return;
      var raw = list[idx++];
      var name = sanitizeForTTS(raw);
      if (!name){ next(); return; }

      var u = new SpeechSynthesisUtterance(name);
      u.lang = 'zh-CN';
      if (zhVoice) u.voice = zhVoice;
      u.rate = 1.0;
      u.pitch = 1.0;
      u.volume = 1.0;
      u.onend = function(){ setTimeout(next, 60); };
      u.onerror = function(){ setTimeout(next, 60); };
      try { window.speechSynthesis.speak(u); } catch(e){}
    }
    next();
  }

  function bindPrimeOnAnyGesture(){
    var done = false;
    function handler(){
      if (done) return;
      done = true;
      primeSpeech();
      document.removeEventListener('touchstart', handler);
      document.removeEventListener('mousedown', handler);
      document.removeEventListener('click', handler);
    }
    document.addEventListener('touchstart', handler, { passive: true });
    document.addEventListener('mousedown', handler);
    document.addEventListener('click', handler);
  }
  bindPrimeOnAnyGesture();

  btnVoice.addEventListener('click', function(){
    if (!speechSupported){ alert('当前浏览器不支持语音播报。'); return; }
    primeSpeech();
    voiceOn = !voiceOn;
    if (voiceOn){
      btnVoice.textContent = '🔊';
      btnVoice.className = 'voice';
      pollVoices(function(){
        try {
          window.speechSynthesis.cancel();
          var t = new SpeechSynthesisUtterance('语音已开启');
          t.lang = 'zh-CN';
          if (zhVoice) t.voice = zhVoice;
          window.speechSynthesis.speak(t);
        } catch(e){}
      });
    } else {
      btnVoice.textContent = '🔇';
      btnVoice.className = 'voice off';
      try { window.speechSynthesis.cancel(); } catch(e){}
    }
  });

  if (speechSupported){
    pollVoices(function(){ /* 静默准备 */ });
  }

  // ================= 按钮 =================
  var selected = 1;
  countBtns.forEach(function(b){
    b.addEventListener('click', function(){
      countBtns.forEach(function(x){ x.classList.remove('active'); });
      b.classList.add('active');
      selected = parseInt(b.dataset.count, 10);
      resultEl.classList.remove('show');
    });
  });

  function spinFast(){ targetVelY = 0.16; targetVelX = 0.035; }
  function spinIdle(){ targetVelY = 0.0025; targetVelX = 0.0008; }

  function getBallPos(name){
    for (var i = 0; i < items.length; i++){
      if (items[i].name === name){
        var r = items[i].el.getBoundingClientRect();
        return {
          x: r.left + r.width / 2 - window.innerWidth / 2,
          y: r.top + r.height / 2 - window.innerHeight / 2
        };
      }
    }
    return { x: 0, y: 0 };
  }

  btnStart.addEventListener('click', function(){
    primeSpeech();

    if (!running){
      spinFast();
      running = true;
      btnStart.textContent = '停止';
      btnStart.className = 'stop';
      resultEl.classList.remove('show');
      if (speechSupported) { try { window.speechSynthesis.cancel(); } catch(e){} }
    } else {
      spinIdle();
      running = false;
      btnStart.textContent = '开始';
      btnStart.className = 'start';

      var arr = draw(selected);

      stage.classList.remove('pulse');
      void stage.offsetWidth;
      stage.classList.add('pulse');
      setTimeout(function(){ stage.classList.remove('pulse'); }, 720);

      if (!arr.length){
        resultEl.innerHTML = '<span style="--from-x:0;--from-y:0;font-size:120px;-webkit-text-fill-color:#ffe08a;">已抽完</span>';
        resultEl.classList.add('show');
        return;
      }

      var w = window.innerWidth, h = window.innerHeight;
      var localMax = 2;
      arr.forEach(function(p){ if (p.name.length > localMax) localMax = p.name.length; });
      var fs = pickFontSize(arr.length, w, h, localMax);

      var html = '';
      for (var i = 0; i < arr.length; i++){
        var pos = getBallPos(arr[i].name);
        var delay = (i * 0.12).toFixed(2);
        html += '<span style="' +
          '--from-x:' + pos.x.toFixed(0) + 'px;' +
          '--from-y:' + pos.y.toFixed(0) + 'px;' +
          'font-size:' + fs + 'px;' +
          'animation-delay:' + delay + 's;' +
          '">' +
          arr[i].name.replace(/[&<>"']/g, function(c){
            return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
          }) +
        '</span>';
      }
      resultEl.innerHTML = html;
      resultEl.classList.add('show');

      var ttsArr = [];
      for (var k = 0; k < arr.length; k++) ttsArr.push(arr[k].tts);
      speakNames(ttsArr);
    }
  });

  btnReset.addEventListener('click', function(){
    if (confirm('确定要重置抽取记录么？（名单文件不受影响）')){
      choosed = {};
      saveChoosed();
      items.forEach(function(it){ it.el.className = ''; });
      resultEl.classList.remove('show');
      if (speechSupported) { try { window.speechSynthesis.cancel(); } catch(e){} }
    }
  });

  window.addEventListener('resize', function(){
    if (!resultEl.classList.contains('show')) return;
    var spans = resultEl.querySelectorAll('span');
    if (!spans.length) return;
    var localMax = 2;
    for (var i = 0; i < spans.length; i++){
      if (spans[i].textContent.length > localMax) localMax = spans[i].textContent.length;
    }
    var fs = pickFontSize(spans.length, window.innerWidth, window.innerHeight, localMax);
    for (var i = 0; i < spans.length; i++) spans[i].style.fontSize = fs + 'px';
  });

  // ============ 启动 ============
  initStars();
  buildStage();
  step(16.7);
  drawStars(0);
  requestAnimationFrame(render);
})();
</script>
</body>
</html>
